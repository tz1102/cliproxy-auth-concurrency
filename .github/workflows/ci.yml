name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests
        run: CGO_ENABLED=1 go test -race ./...
      - name: Build CPA native Linux amd64 library
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -o auth-concurrency.so ./cmd/cliproxy-auth-concurrency
          rm -f auth-concurrency.h
          file auth-concurrency.so
      - uses: actions/upload-artifact@v4
        with:
          name: auth-concurrency-linux-amd64
          path: auth-concurrency.so
